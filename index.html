<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Andalarasa</title>
<style>
:root{--bg:#fff3a8;--panel:#ffffff;--ink:#1d3a22;--g:#1f5a2a;--g2:#3d8a45;--acc:#c8872a;--bad:#b3402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:14px;display:flex;flex-direction:column;gap:10px}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0;color:var(--g)}
h1{font-size:2.3rem;line-height:1.05}
.card{background:var(--panel);border:3px solid var(--g);border-radius:18px;padding:16px}
.btn{background:var(--g);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
:root[data-theme="dark"] .btn,.btn:focus-visible{outline:3px solid var(--acc)}

.btn:active{transform:scale(.96)}
.hud{display:flex;justify-content:space-between;font-weight:700;gap:8px}
.bar{height:10px;border-radius:6px;background:rgba(0,0,0,.15);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:100%;transition:width 1s linear}
.stage{position:relative;height:340px;border-radius:18px;border:3px solid var(--g);background:repeating-linear-gradient(135deg,rgba(61,138,69,.18) 0 14px,rgba(61,138,69,.06) 14px 28px);overflow:hidden;touch-action:manipulation}
.it{position:absolute;width:54px;height:54px;border:0;border-radius:50%;font-size:30px;line-height:1;cursor:pointer;padding:0;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.3)}}
.ripe{background:radial-gradient(circle at 35% 30%,#5d7a45,#1f3a1c)}
.unripe{background:radial-gradient(circle at 35% 30%,#ff9a85,#b33a2a)}
.clean{background:radial-gradient(circle at 35% 30%,#8fd18c,#2f7a37)}
.dirty{background:#d9c9a0}
.pack{background:#fff;border:3px solid var(--g)}
.fl{position:absolute;font-weight:800;pointer-events:none;animation:fl .7s forwards}
@keyframes fl{to{transform:translateY(-40px);opacity:0}}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{text-align:left;background:transparent;color:var(--ink);border:2px solid var(--g);border-radius:12px;padding:11px;font-size:1rem;cursor:pointer;font-family:inherit}
.opt.ok{background:var(--g2);color:#fff}.opt.no{background:var(--bad);color:#fff}
.zone{position:relative;height:46px;border-radius:12px;background:rgba(0,0,0,.15);overflow:hidden;margin:16px 0}
.zone b{position:absolute;top:0;bottom:0;background:var(--g2);opacity:.85}
.zone s{position:absolute;top:0;bottom:0;width:8px;background:var(--acc);text-decoration:none}
.big{width:100%;padding:26px;font-size:1.5rem}
p{margin:6px 0;line-height:1.45}
.fact{border-left:5px solid var(--acc);padding-left:10px}
@media (prefers-reduced-motion:reduce){.it,.fl{animation:none}}
body{background:linear-gradient(180deg,#8fdcff 0,#d6f5ff 28%,#fff3a8 62%,#c8ee8a 100%) fixed;font-size:20px;align-items:flex-start;overflow-y:auto}
body::after{content:'';position:fixed;left:-10%;right:-10%;bottom:-70px;height:170px;background:radial-gradient(ellipse at 30% 0,#4fae4f 0 55%,transparent 56%),radial-gradient(ellipse at 80% 20%,#2f8f3d 0 55%,transparent 56%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;padding:16px 14px 110px;gap:14px}
.card{border-radius:26px;border:4px solid var(--g);box-shadow:0 7px 0 #1a5a2a,0 12px 20px rgba(0,0,0,.18);padding:20px;position:relative}
.card::after{content:'🌿';position:absolute;right:12px;top:-22px;font-size:40px}
h1{font-size:3rem;background:var(--g);color:#fff;border-radius:18px;padding:12px 16px;margin-bottom:12px;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
h2{font-size:2.1rem;line-height:1.15;color:#13501f}
p{font-size:1.3rem;line-height:1.5;margin:10px 0}
.hud{background:var(--g);color:#fff;border-radius:16px;padding:12px 16px;font-size:1.3rem}
.btn{background:linear-gradient(#ffc13a,#ff9a1a);color:#3b1c00;font-size:1.45rem;padding:16px 24px;border-bottom:6px solid #b85a00;border-radius:18px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.btn:active{transform:translateY(4px);border-bottom-width:2px}
.big{padding:26px;font-size:1.8rem}
.bar{height:16px;border-radius:10px;border:2px solid var(--g);background:#fff;margin-top:10px}
.bar i{background:linear-gradient(90deg,#ff9a1a,#ffd23a)}
.stage{height:440px;border:4px solid var(--g);border-radius:24px;background:radial-gradient(circle at 85% 12%,#ffe45c 0 36px,transparent 38px),linear-gradient(180deg,#bfeeff 0,#e7f9c9 45%,#9fdc6a 100%);box-shadow:0 6px 0 #1a5a2a}
.it{width:68px;height:68px;font-size:38px;border:3px solid #fff;box-shadow:0 5px 8px rgba(0,0,0,.3)}
.ripe::after,.unripe::after,.clean::after{content:'';position:absolute;left:16px;top:12px;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.55)}
.opts{gap:12px;margin-top:14px}
.opt{font-size:1.35rem;line-height:1.35;padding:16px;border:3px solid var(--g);background:#fff;border-radius:16px;font-weight:700;color:#13501f}
.opt.ok{background:#2f9a3d;color:#fff}.opt.no{background:#d4493a;color:#fff}
.fact{font-size:1.25rem;background:#fff6c8;border-radius:12px;padding:12px 14px;border-left-width:8px}
.zone{height:64px;border:3px solid var(--g);background:#fff}.zone s{width:12px}
.fl{font-size:1.8rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=document.getElementById('app');
const NAMES=['Panen','Pencucian','Pengeringan','Penggilingan','Pengemasan'];
const QUIZ=[
['Andaliman tumbuh di dataran tinggi Sumatera, terutama daerah…',['Tapanuli dan sekitarnya','Pesisir Jawa','Pulau Bali'],0,'Andaliman adalah rempah khas Sumatera Utara.'],
['Andaliman dipanen saat warna buahnya mulai…',['Merah muda','Hijau kehitaman','Kuning cerah'],1,'Buah matang berwarna hijau kehitaman dengan aroma khas.'],
['Pengeringan andaliman dilakukan dengan cara…',['Direbus','Dibekukan','Dijemur atau memakai oven'],2,'Kadar air dikurangi sampai buah kering.'],
['Buah kering digiling memakai blender atau grinder hingga menjadi…',['Bubuk yang lembut','Pasta basah','Potongan kasar'],0,'Bubuk lembut siap dipakai di dapur.'],
['Bubuk andaliman sebaiknya disimpan dalam kemasan…',['Terbuka','Kedap udara dan bersih','Basah agar harum'],1,'Kemasan kedap udara menjaga kualitas dan aroma.']];
let st=0,total=0,timers=[];
const clr=()=>{timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[]};
const h=(s)=>{$.innerHTML=s};
const $q=s=>document.querySelector(s);

function intro(){clr();st=0;total=0;
h(`<div class="card"><h1>Petualangan Andalarasa</h1><p><b>Dari kebun andaliman sampai jadi bubuk berkelas.</b></p>
<p class="fact">Andaliman adalah rempah khas Sumatera Utara: rasanya pedas, getir, dan menyegarkan, dengan aroma segar yang sedikit tajam.</p>
<p>Selesaikan 5 tahap pembuatan bubuk andaliman. Tiap tahap ada mini game dan satu pertanyaan.</p>
<button class="btn big" id="go">Mulai bertani</button></div>`);
$q('#go').onclick=()=>stage();}

function head(extra=''){return `<div class="hud"><span>Tahap ${st+1}/5: ${NAMES[st]}</span><span>Skor ${total}</span></div>${extra}`}
const INFO=[
'Ketuk buah andaliman hijau kehitaman yang matang. Jangan ketuk buah merah muda yang belum matang atau daun.',
'Bersihkan kotoran dan daun yang menempel. Jangan ketuk buah yang sudah bersih.',
'Jemur buah: ketuk tombol saat penanda ada di zona hijau. Ada 5 kesempatan.',
'Giling buah kering secepat mungkin selama 10 detik.',
'Pilih kemasan yang kedap udara dan bersih. Hindari wadah terbuka dan kemasan basah.'];

function stage(){clr();
h(`<div class="card">${head()}<h2>${NAMES[st]}</h2><p>${INFO[st]}</p><button class="btn" id="s">Siap!</button></div>`);
$q('#s').onclick=[spawnGame.bind(null,{time:20,gap:650,life:1500,items:[
 {c:'ripe',e:'',p:10,w:5},{c:'unripe',e:'',p:-5,w:2},{c:'',e:'🍃',p:-5,w:1}]}),
 spawnGame.bind(null,{time:18,gap:600,life:1700,items:[
 {c:'dirty',e:'🟤',p:10,w:3},{c:'dirty',e:'🍂',p:10,w:3},{c:'clean',e:'',p:-5,w:2}]}),
 timing,grind,
 spawnGame.bind(null,{time:18,gap:650,life:1600,items:[
 {c:'pack',e:'📦',p:10,w:4},{c:'pack',e:'🥡',p:-5,w:2},{c:'pack',e:'💦',p:-5,w:2}]})][st];}

function spawnGame(cfg){let sc=0,t=cfg.time;
h(`<div class="card">${head('<div class="bar"><i id="b"></i></div>')}</div><div class="stage" id="a"></div><div class="hud"><span id="t">${t} detik</span><span id="sc">+0</span></div>`);
const a=$q('#a'),tot=cfg.items.reduce((x,i)=>x+i.w,0);
const flash=(x,y,txt,col)=>{const f=document.createElement('div');f.className='fl';f.style.cssText=`left:${x}px;top:${y}px;color:${col}`;f.textContent=txt;a.appendChild(f);setTimeout(()=>f.remove(),700)};
const spawn=()=>{let r=Math.random()*tot,it=cfg.items[0];for(const i of cfg.items){if((r-=i.w)<0){it=i;break}}
 const b=document.createElement('button');b.className='it '+it.c;b.textContent=it.e;b.setAttribute('aria-label','item');
 b.style.left=Math.random()*(a.clientWidth-74)+'px';b.style.top=Math.random()*(a.clientHeight-74)+'px';
 b.onclick=()=>{sc=Math.max(0,sc+it.p);$q('#sc').textContent='+'+sc;flash(b.offsetLeft,b.offsetTop,(it.p>0?'+':'')+it.p,it.p>0?'#2f7a37':'#b3402f');b.remove()};
 a.appendChild(b);setTimeout(()=>b.remove(),cfg.life)};
spawn();timers.push(setInterval(spawn,cfg.gap));
setTimeout(()=>{$q('#b').style.width='0%'},30);
timers.push(setInterval(()=>{t--;$q('#t').textContent=t+' detik';if(t<=0){clr();finish(Math.min(100,sc))}},1000));}

function timing(){let n=5,sc=0,pos=0,dir=1,sp=1.4;
const z0=38,z1=62;
h(`<div class="card">${head()}<p id="m">Sisa kesempatan: 5</p><div class="zone"><b style="left:${z0}%;width:${z1-z0}%"></b><s id="k"></s></div><button class="btn big" id="j">☀️ Jemur!</button></div>`);
const k=$q('#k');
timers.push(setInterval(()=>{pos+=dir*sp;if(pos>=96||pos<=0)dir*=-1;k.style.left=pos+'%'},16));
$q('#j').onclick=()=>{const hit=pos+2>=z0&&pos+2<=z1;if(hit)sc+=20;n--;sp+=.35;
 $q('#m').textContent=(hit?'Tepat! Kering merata. ':'Meleset. ')+'Sisa kesempatan: '+n;
 if(n<=0){clr();setTimeout(()=>finish(sc),500)}};}

function grind(){let t=10,c=0;
h(`<div class="card">${head()}<p><b id="t">${t} detik</b> · Ketukan: <b id="c">0</b></p><div class="bar"><i id="b"></i></div></div><button class="btn big" id="g" style="margin-top:6px">⚙️ GILING!</button>`);
setTimeout(()=>{$q('#b').style.width='0%'},30);
$q('#g').onclick=()=>{c++;$q('#c').textContent=c};
timers.push(setInterval(()=>{t--;$q('#t').textContent=t+' detik';if(t<=0){clr();finish(Math.min(100,c*3))}},1000));}

function finish(sc){if(sc<20){h(`<div class="card">${head()}<h2>Belum lulus tahap ini</h2><p>Kamu baru dapat <b>${sc} poin</b>. Minimal <b>20 poin</b> untuk lanjut ke tahap berikutnya.</p><button class="btn big" id="rt">Coba lagi</button></div>`);$q('#rt').onclick=stage;return}total+=sc;
h(`<div class="card">${head()}<h2>+${sc} poin</h2><p>Jawab pertanyaan ini dengan benar untuk lanjut (+20 poin, atau +10 jika salah dulu).</p><button class="btn" id="q">Lanjut ke pertanyaan</button></div>`);
$q('#q').onclick=quiz;}

function quiz(){const [q,o,a,fact]=QUIZ[st];
h(`<div class="card">${head()}<h2>${q}</h2><div class="opts">${o.map((x,i)=>`<button class="opt" data-i="${i}">${x}</button>`).join('')}</div><p class="fact" id="f" hidden></p></div>`);
let tries=0;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===a;if(!ok){tries++;b.classList.add('no');b.disabled=true;const f=$q('#f');f.hidden=false;f.textContent='Jawaban salah. Kamu belum bisa lanjut, coba pilih jawaban lain!';return}
 document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
 b.classList.add(ok?'ok':'no');if(!ok)document.querySelector(`[data-i="${a}"]`).classList.add('ok');
 total+=tries?10:20;
 const f=$q('#f');f.hidden=false;f.textContent=(ok?'Benar! ':'Belum tepat. ')+fact;
 const nb=document.createElement('button');nb.className='btn';nb.style.marginTop='10px';nb.textContent=st<4?'Tahap berikutnya':'Lihat hasil';
 nb.onclick=()=>{st++;st<5?stage():end()};f.after(nb)})}

function end(){const r=total>=450?['Maestro Andalarasa','Bumbu khas, rasa berkelas, kamu ahlinya!']:total>=300?['Juragan Rempah','Hampir sempurna, ayo coba lagi!']:['Petani Pemula','Terus belajar, rempah kecil manfaat besar!'];
h(`<div class="card"><h1>${r[0]}</h1><h2>${total} / 600 poin</h2><p>${r[1]}</p>
<p class="fact">Manfaat andaliman: menambah cita rasa masakan, membantu melancarkan pencernaan, memiliki sifat antioksidan, dan berpotensi sebagai antibakteri alami.</p>
<p>Coba di Nasi Goreng Andaliman, Mie Gomak Andaliman, atau Sambal Andaliman. Dukung UMKM lokal untuk produk unggulan Sumatera!</p>
<button class="btn big" id="r">Main lagi</button></div>`);
$q('#r').onclick=intro;}
intro();
</script>
</body>
</html>
